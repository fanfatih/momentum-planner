<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sedang offline | Momentum Planner</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7f0;
        color: #2b1f1d;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-family: Georgia, serif;
        color: #b93636;
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        max-width: 32ch;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 10px;
        background: #b93636;
        color: #faf7f0;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #2b1f1d;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kamu sedang offline</h1>
      <p>Momentum Planner belum bisa dimuat tanpa internet. Sambungkan lagi, lalu coba buka ulang.</p>
      <a href="/">Coba muat ulang</a>
    </main>
  </body>
</html>
